<html lang="en">

<style>
  /* Palette lifted from circuitpython.org: brand purple #652f8f, a light
     grey page behind white rounded cards, and generous corner radii. */
  :root {
    --bg: #f0f0f0;
    --panel: #ffffff;
    --text: #222222;
    --muted: #666a73;
    --border: #e1e2e6;
    --accent: #652f8f;
    --accent-hover: #4a2269;
    --accent-text: #ffffff;
    --accent-bg: #f1e9f8;
    --ok: #1b7f4d;
    --ok-bg: #e7f6ee;
    --warn: #9a6400;
    --warn-bg: #fbf0d9;
    --chip-bg: #eeeeee;
    --code-bg: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #19171c;
      --panel: #262229;
      --text: #eeeaf1;
      --muted: #a9a2b0;
      --border: #3a3440;
      --accent: #c9a4ea;
      --accent-hover: #dabff0;
      --accent-text: #241a2c;
      --accent-bg: #372c42;
      --ok: #6fd6a0;
      --ok-bg: #1c3327;
      --warn: #e0b64c;
      --warn-bg: #3a2f14;
      --chip-bg: #322c39;
      --code-bg: #262229;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Proxima Nova", "Montserrat", "Lucida Grande",
      "Lucida Sans Unicode", "Lucida Sans", Geneva, Verdana, sans-serif;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  .hero {
    background: var(--panel);
    border-radius: 24px;
    padding: 24px 28px;
    margin-bottom: 20px;
  }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; color: var(--accent); }
  .subtitle { color: var(--muted); margin: 0; font-size: 14px; }
  .search-wrap { position: relative; margin-top: 18px; }
  #search, #search-b {
    width: 100%;
    padding: 12px 16px;
    /* 16px minimum: below this, Mobile Safari auto-zooms the page on focus */
    font-size: 16px;
    border: 2px solid var(--accent);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
  }
  #dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 10;
    display: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  #dropdown.open { display: block; }
  .dd-item { padding: 8px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .dd-item:hover, .dd-item.active { background: var(--accent-bg); }
  .dd-header {
    position: sticky;
    top: 0;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .dd-name { font-weight: 600; }
  .dd-meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  mark { background: var(--accent-bg); color: var(--accent); border-radius: 3px; padding: 0 1px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip {
    padding: 2px 9px;
    border-radius: 999px;
    border: 1.5px solid var(--accent);
    background: var(--panel);
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
  }
  .chip:hover { background: var(--accent-bg); }
  .chip.selected { background: var(--accent); color: var(--accent-text); }

  .chips-row { margin-top: 14px; }
  .chips-row .chips { margin-top: 6px; }
  .chips-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .clear-recent {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    text-decoration: underline;
    cursor: pointer;
  }
  .clear-recent:hover { color: var(--accent); }

  .card {
    background: var(--panel);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card.board-header {
    overflow: hidden;
    /* Query against this card's own rendered width (not the viewport):
       compare-mode puts it in a narrow grid column even on a wide
       screen, where the side-by-side title+photo layout below has no
       room to work. */
    container-type: inline-size;
  }
  .board-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .board-thumb {
    flex: none;
    display: block;
    height: 96px;
    margin: -18px -20px -18px 0;
    background: transparent;
    overflow: hidden;
  }
  .board-thumb img { display: block; height: 100%; width: auto; transform: scale(1.1); }
  .board-header-text { min-width: 0; }

  @container (max-width: 480px) {
    .board-header-row { flex-direction: column; align-items: stretch; }
    .board-thumb {
      height: auto;
      max-height: 180px;
      width: 100%;
      margin: 12px 0 0;
      display: flex;
      justify-content: center;
      overflow: visible;
    }
    .board-thumb img {
      height: auto;
      max-height: 180px;
      width: auto;
      max-width: 100%;
      transform: none;
      border-radius: 10px;
    }
  }
  .board-header h2 { margin: 0 0 4px; font-size: 21px; font-weight: 700; }
  .card h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .board-meta { color: var(--muted); font-size: 13.5px; }
  .board-meta code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .board-meta [title] { cursor: help; }
  .board-meta span[title] { border-bottom: 1px dotted var(--muted); }

  .obj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 6px; }
  .obj-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    background: var(--bg);
  }
  .obj-card .obj-title { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.no { background: var(--chip-bg); color: var(--muted); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .obj-pins { font-size: 12px; margin-top: 3px; color: var(--muted); }
  .obj-note { font-size: 11.5px; margin-top: 3px; color: var(--warn); }
  .obj-names { font-size: 11.5px; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; }
  .pin-alias {
    display: inline-block;
    background: var(--chip-bg);
    border-radius: 6px;
    padding: 1px 7px;
    margin: 1px 3px 1px 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }
  .mcu-pin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }

  details.section { margin-top: 8px; }
  details.section summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .subsection { margin: 18px 0 0; font-size: 14px; color: var(--muted); }

  .empty-state { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 32px; text-align: center; }
  footer a { color: var(--accent); }

  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .hero-text { flex: 1; min-width: 0; }
  .github-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 4px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .github-link:hover { color: var(--accent); }
  .github-link svg { width: 18px; height: 18px; fill: currentColor; }

  .compare-toggle {
    display: inline-block;
    margin-top: 10px;
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: underline;
  }
  .search-wrap.compare-search { margin-top: 10px; }
  .compare-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .exit-compare {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .exit-compare:hover { color: var(--accent); border-color: var(--accent); }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .compare-grid .card { margin-bottom: 0; }
  @media (max-width: 700px) {
    .compare-grid { grid-template-columns: 1fr; }
    /* Cards are in header/objects/pins-interleaved DOM order (so the
       2-column layout above aligns matching rows) — regroup each
       board's own three cards together once stacked into one column. */
    .compare-grid > *:nth-child(1) { order: 1; }
    .compare-grid > *:nth-child(3) { order: 2; }
    .compare-grid > *:nth-child(5) { order: 3; }
    .compare-grid > *:nth-child(2) { order: 4; }
    .compare-grid > *:nth-child(4) { order: 5; }
    .compare-grid > *:nth-child(6) { order: 6; }
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="hero-top">
      <div class="hero-text">
        <h1>CircuitPython Board Viewer</h1>
        <p class="subtitle">
          Look up a board's pin names and which <code>board.SPI()</code>,
          <code>board.I2C()</code>, <code>board.UART()</code>, and
          <code>board.DISPLAY</code> objects it actually exposes.
        </p>
      </div>
      <a class="github-link" href="https://github.com/todbot/CircuitPython_BoardViewer" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        GitHub
      </a>
    </div>

    <div class="search-wrap" id="search-wrap-a">
      <input id="search" type="text" placeholder="Search boards by name or id&hellip; or click quick board below (press / to focus)" autocomplete="off">
      <div id="dropdown"></div>
    </div>
    <button class="compare-toggle" id="compare-toggle" type="button">&#8644; Compare with another board</button>
    <div class="search-wrap compare-search" id="search-wrap-b" style="display:none;">
      <input id="search-b" type="text" placeholder="Compare with&hellip;" autocomplete="off">
      <div id="dropdown-b"></div>
    </div>
    <div class="chips-row" id="recent-row" style="display:none;">
      <div class="chips-label">
        Recently viewed
        <button class="clear-recent" id="clear-recent" type="button">clear</button>
      </div>
      <div class="chips" id="recent-chips"></div>
    </div>
    <div class="chips" id="quick-chips"></div>
  </div>

  <div id="board-view"></div>

  <footer id="footer"></footer>
</main>

<script>
const QUICK_BOARDS = [
  "raspberry_pi_pico",
  "adafruit_feather_esp32s3_tft",
  "adafruit_qtpy_esp32s3_nopsram",
  "feather_m4_express",
  "circuitplayground_bluefruit",
  "adafruit_metro_rp2350",
  "seeeduino_xiao_rp2040",
  "seeeduino_xiao_rp2350",
  "lilygo_tqt_pro_psram",
];

const DEFAULT_BOARD = ""; //raspberry_pi_pico";

const RECENT_KEY = "cpbv_recent_boards";
const MAX_RECENT = 8;

const DISPLAY_VARIANT_LABELS = {
  display: "regular display",
  epaper_display: "e-paper display",
  framebuffer_display: "framebuffer display",
};

let DATA = null;
let SEARCH_INDEX = [];
let currentBoardId = null;
let compareBoardId = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return (
    escapeHtml(text.slice(0, idx)) +
    "<mark>" + escapeHtml(text.slice(idx, idx + query.length)) + "</mark>" +
    escapeHtml(text.slice(idx + query.length))
  );
}

// Reusable board-search combo box: owns its own active-index state via
// closure, so two independent instances (primary + compare) can coexist.
function createBoardPicker(inputEl, dropdownEl, onSelect) {
  let activeIndex = -1;

  function updateActive(items) {
    items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
    if (activeIndex >= 0) items[activeIndex].scrollIntoView({ block: "nearest" });
  }

  function filter(query) {
    const q = query.trim().toLowerCase();
    const browsingAll = !q;
    const matches = browsingAll
      ? SEARCH_INDEX
      : SEARCH_INDEX.filter((e) => e.haystack.includes(q)).slice(0, 25);

    if (matches.length === 0) {
      dropdownEl.innerHTML = '<div class="dd-item"><span class="dd-meta">No boards found</span></div>';
      dropdownEl.classList.add("open");
      activeIndex = -1;
      return;
    }

    const headerHtml = browsingAll
      ? `<div class="dd-header">All ${matches.length} boards, A&ndash;Z</div>` : "";

    dropdownEl.innerHTML = headerHtml + matches.map((m, i) => `
      <div class="dd-item" data-id="${escapeHtml(m.id)}" data-index="${i}">
        <span class="dd-name">${highlightMatch(m.name, query)}</span>
        <span class="dd-meta">${escapeHtml(m.port)} &middot; ${highlightMatch(m.id, query)}</span>
      </div>`).join("");
    dropdownEl.classList.add("open");
    activeIndex = -1;

    dropdownEl.querySelectorAll(".dd-item[data-id]").forEach((el) => {
      el.addEventListener("click", () => onSelect(el.dataset.id));
    });
  }

  function close() {
    dropdownEl.classList.remove("open");
    dropdownEl.innerHTML = "";
    activeIndex = -1;
  }

  function onKeyDown(e) {
    const items = dropdownEl.querySelectorAll(".dd-item[data-id]");
    if (!dropdownEl.classList.contains("open") || items.length === 0) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      updateActive(items);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      updateActive(items);
    } else if (e.key === "Enter") {
      e.preventDefault();
      const target = activeIndex >= 0 ? items[activeIndex] : items[0];
      if (target) onSelect(target.dataset.id);
    } else if (e.key === "Escape") {
      close();
    }
  }

  inputEl.addEventListener("input", () => filter(inputEl.value));
  inputEl.addEventListener("focus", () => filter(inputEl.value));
  inputEl.addEventListener("keydown", onKeyDown);

  return { filter, close };
}

let primaryPicker = null;
let comparePicker = null;

async function init() {
  const res = await fetch("board_data.json");
  DATA = await res.json();

  SEARCH_INDEX = Object.entries(DATA.boards).map(([id, b]) => ({
    id, name: b.name, port: b.port,
    haystack: [id, b.name, ...(b.aliases || [])].join(" ").toLowerCase(),
  })).sort((a, b) => a.name.localeCompare(b.name));

  renderQuickChips();
  renderRecentChips();
  renderFooter();

  document.getElementById("clear-recent").addEventListener("click", () => {
    localStorage.removeItem(RECENT_KEY);
    renderRecentChips();
  });

  primaryPicker = createBoardPicker(
    document.getElementById("search"),
    document.getElementById("dropdown"),
    selectBoard
  );
  comparePicker = createBoardPicker(
    document.getElementById("search-b"),
    document.getElementById("dropdown-b"),
    selectCompareBoard
  );

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#search-wrap-a")) primaryPicker.close();
    if (!e.target.closest("#search-wrap-b")) comparePicker.close();
  });

  document.getElementById("compare-toggle").addEventListener("click", () => {
    const wrapB = document.getElementById("search-wrap-b");
    if (wrapB.style.display === "none") {
      wrapB.style.display = "block";
      document.getElementById("compare-toggle").textContent = "✕ Cancel compare";
      document.getElementById("search-b").focus();
    } else {
      exitCompare();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "/") return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    e.preventDefault();
    document.getElementById("search").focus();
  });

  const compareMatch = location.hash.match(/compare=([\w.-]+),([\w.-]+)/);
  const boardMatch = location.hash.match(/board=([\w.-]+)/);

  if (compareMatch && DATA.boards[compareMatch[1]] && DATA.boards[compareMatch[2]]) {
    currentBoardId = compareMatch[1];
    compareBoardId = compareMatch[2];
    document.getElementById("search").value = DATA.boards[currentBoardId].name;
    document.getElementById("search-b").value = DATA.boards[compareBoardId].name;
    document.getElementById("search-wrap-b").style.display = "block";
    document.getElementById("compare-toggle").textContent = "✕ Cancel compare";
    addRecent(compareBoardId);
    addRecent(currentBoardId);
    render();
  } else if (boardMatch && DATA.boards[boardMatch[1]]) {
    selectBoard(boardMatch[1]);
  } else if (DEFAULT_BOARD && DATA.boards[DEFAULT_BOARD]) {
    selectBoard(DEFAULT_BOARD);
  } else {
    renderEmptyState();
  }
}

function renderChipRow(containerId, ids) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  for (const id of ids) {
    const board = DATA.boards[id];
    if (!board) continue;
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.type = "button";
    chip.textContent = board.name;
    chip.addEventListener("click", () => selectBoard(id));
    wrap.appendChild(chip);
  }
}

function renderQuickChips() {
  renderChipRow("quick-chips", QUICK_BOARDS);
}

function loadRecent() {
  try {
    return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
  } catch {
    return [];
  }
}

function addRecent(id) {
  const recent = loadRecent();
  if (!recent.includes(id)) recent.unshift(id);
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent.slice(0, MAX_RECENT)));
  renderRecentChips();
}

function renderRecentChips() {
  const recent = loadRecent().filter((id) => DATA.boards[id]);
  document.getElementById("recent-row").style.display = recent.length ? "block" : "none";
  renderChipRow("recent-chips", recent);
}

function render() {
  if (currentBoardId && compareBoardId) {
    renderCompare(currentBoardId, compareBoardId);
  } else if (currentBoardId) {
    renderBoard(currentBoardId);
  } else {
    renderEmptyState();
  }
  updateUrl();
  updateChipSelection();
}

function updateUrl() {
  if (currentBoardId && compareBoardId) {
    history.replaceState(null, "", `#compare=${currentBoardId},${compareBoardId}`);
  } else if (currentBoardId) {
    history.replaceState(null, "", `#board=${currentBoardId}`);
  }
}

function updateChipSelection() {
  document.querySelectorAll("#quick-chips .chip, #recent-chips .chip").forEach((chip) => {
    chip.classList.toggle("selected", currentBoardId && chip.textContent === DATA.boards[currentBoardId].name);
  });
}

function selectBoard(id) {
  currentBoardId = id;
  document.getElementById("search").value = DATA.boards[id].name;
  primaryPicker.close();
  addRecent(id);
  render();
}

function selectCompareBoard(id) {
  compareBoardId = id;
  document.getElementById("search-b").value = DATA.boards[id].name;
  comparePicker.close();
  addRecent(id);
  render();
}

function exitCompare() {
  compareBoardId = null;
  document.getElementById("search-b").value = "";
  document.getElementById("search-wrap-b").style.display = "none";
  document.getElementById("compare-toggle").textContent = "⇄ Compare with another board";
  render();
}

function renderEmptyState() {
  document.getElementById("board-view").innerHTML =
    '<div class="empty-state">Search for a board above, or pick one of the quick links.</div>';
}

function objectCard(label, obj) {
  if (!obj) {
    return `<div class="obj-card">
      <div class="obj-title">${label} <span class="badge no">not defined</span></div>
    </div>`;
  }
  const available = obj.available !== false;
  const badge = available
    ? (obj.note ? '<span class="badge warn">defined</span>' : '<span class="badge ok">available</span>')
    : '<span class="badge warn">pins configured, not exposed</span>';
  const pinsHtml = obj.pins
    ? '<div class="obj-pins">' + Object.entries(obj.pins).map(([k, v]) =>
        `<span class="mcu-pin">${escapeHtml(k)}: ${escapeHtml(v)}</span>`).join(" &middot; ") + '</div>'
    : '<div class="obj-pins">pins not known</div>';
  const namesHtml = obj.names && obj.names.length
    ? `<div class="obj-names">as: ${obj.names.map((n) => `<span class="pin-alias">${escapeHtml(n)}</span>`).join("")}</div>`
    : "";
  const noteHtml = obj.note ? `<div class="obj-note">${escapeHtml(obj.note)}</div>` : "";
  return `<div class="obj-card">
    <div class="obj-title">${label} ${badge}</div>
    ${namesHtml}
    ${pinsHtml}
    ${noteHtml}
  </div>`;
}

function displayCard(display) {
  if (!display) {
    return `<div class="obj-card">
      <div class="obj-title">DISPLAY <span class="badge no">not defined</span></div>
    </div>`;
  }
  const label = DISPLAY_VARIANT_LABELS[display.variant] || display.variant;
  return `<div class="obj-card">
    <div class="obj-title">DISPLAY <span class="badge ok">available</span></div>
    <div class="obj-names">type: <span class="pin-alias">${escapeHtml(label)}</span></div>
    <div class="obj-note">size/driver chip not extractable from board data</div>
  </div>`;
}

function boardCardsHtml(id) {
  const parts = boardCardParts(id);
  return parts.header + parts.objects + parts.pins;
}

function boardCardParts(id) {
  const b = DATA.boards[id];

  const aliasHtml = (b.aliases && b.aliases.length)
    ? ` &middot; also known as ${b.aliases.map(escapeHtml).join(", ")}`
    : "";

  const stemmaCardHtml = b.objects.stemma_i2c ? objectCard("STEMMA_I2C", b.objects.stemma_i2c) : "";

  const objectsHtml = `
    <div class="obj-grid">
      ${objectCard("I2C()", b.objects.i2c)}
      ${objectCard("SPI()", b.objects.spi)}
      ${objectCard("UART()", b.objects.uart)}
      ${displayCard(b.objects.display)}
      ${stemmaCardHtml}
    </div>`;

  const otherObjectPinsHtml = (o) => {
    if (!o.pins) return '<span class="obj-pins">not extractable (set in board.c)</span>';
    const pinsText = Object.entries(o.pins).map(([k, v]) => `${k}: ${v}`).join(" · ");
    return `<span class="mcu-pin" title="${escapeHtml(o.note || "")}">${escapeHtml(pinsText)} (guess)</span>`;
  };

  const otherHtml = (b.other_objects && b.other_objects.length) ? `
    <h4 class="subsection">Other board objects (${b.other_objects.length})</h4>
    <table>
      <tr><th>Name(s)</th><th>Singleton</th><th>Pins</th></tr>
      ${b.other_objects.map((o) => `
        <tr>
          <td>${o.names.map((n) => `<span class="pin-alias">${escapeHtml(n)}</span>`).join("")}</td>
          <td class="mcu-pin">${escapeHtml(o.singleton)}</td>
          <td>${otherObjectPinsHtml(o)}</td>
        </tr>`).join("")}
    </table>` : "";

  const pinRows = b.pins.map((p) => `
    <tr>
      <td class="mcu-pin">${escapeHtml(p.mcu_pin)}</td>
      <td>${p.names.map((n) => `<span class="pin-alias">${escapeHtml(n)}</span>`).join("")}</td>
    </tr>`).join("");

  const unmappedHtml = (b.unmapped && b.unmapped.length) ? `
    <details class="section">
      <summary>Unrecognized pins.c rows (${b.unmapped.length})</summary>
      <table>${b.unmapped.map((line) => `<tr><td class="mcu-pin">${escapeHtml(line)}</td></tr>`).join("")}</table>
    </details>` : "";

  const cpyorgUrl = `https://circuitpython.org/board/${encodeURIComponent(id)}/`;

  const header = `
    <div class="card board-header">
      <div class="board-header-row">
        <div class="board-header-text">
          <h2>${escapeHtml(b.name)}</h2>
          <div class="board-meta">
            <code title="Board id — matches the board's directory name in the CircuitPython source and this tool's #board= URL">${escapeHtml(id)}</code>
            &middot; <span title="CircuitPython port — the ports/ directory grouping boards by microcontroller family/toolchain">${escapeHtml(b.port)}</span>
            &middot; <span title="Microcontroller — from MICROPY_HW_MCU_NAME in the board's mpconfigboard.h">${escapeHtml(b.mcu || "unknown MCU")}</span>${aliasHtml}
            &middot; <a href="${cpyorgUrl}" target="_blank" rel="noopener">circuitpython.org &#8599;</a>
          </div>
        </div>
        ${b.image ? `
        <a class="board-thumb" href="${cpyorgUrl}" target="_blank" rel="noopener">
          <img src="https://circuitpython.org/assets/images/boards/small/${encodeURIComponent(b.image)}"
               alt="${escapeHtml(b.name)}"
               onerror="this.closest('.board-thumb').style.display='none'">
        </a>` : ""}
      </div>
    </div>`;

  const objects = `
    <div class="card">
      <h3>Board objects</h3>
      ${objectsHtml}
      ${otherHtml}
    </div>`;

  const pins = `
    <div class="card">
      <h3>Pins (${b.pins.length})</h3>
      <table>
        <tr><th>MCU pin</th><th>Board name(s)</th></tr>
        ${pinRows}
      </table>
      ${unmappedHtml}
    </div>`;

  return { header, objects, pins };
}

function renderBoard(id) {
  document.getElementById("board-view").innerHTML = boardCardsHtml(id);
}

function renderCompare(idA, idB) {
  const a = boardCardParts(idA);
  const b = boardCardParts(idB);
  // Each pair (a.X, b.X) lands in the same grid row via plain source-order
  // auto-placement in a 2-column grid, so corresponding cards — header,
  // objects, pins — line up across both columns regardless of how tall
  // either board's content is (grid rows auto-size to their tallest cell).
  document.getElementById("board-view").innerHTML = `
    <div class="compare-bar">
      <button class="exit-compare" type="button" id="exit-compare-btn">✕ Exit compare</button>
    </div>
    <div class="compare-grid">
      ${a.header}${b.header}
      ${a.objects}${b.objects}
      ${a.pins}${b.pins}
    </div>`;
  document.getElementById("exit-compare-btn").addEventListener("click", exitCompare);
}

function renderFooter() {
  const footer = document.getElementById("footer");
  const boardCount = Object.keys(DATA.boards).length;
  const skippedCount = Object.keys(DATA.skipped || {}).length;
  footer.innerHTML = `
    ${boardCount} boards (${skippedCount} skipped — non-classic layout) &middot;
    data generated ${escapeHtml(DATA.generated || "?")}
    ${DATA.cp_sha ? "from CircuitPython @ " + escapeHtml(DATA.cp_sha) : ""}
    &middot; <a href="https://github.com/adafruit/circuitpython" target="_blank" rel="noopener">CircuitPython source</a>`;
}

init();
</script>
</body>
</html>
