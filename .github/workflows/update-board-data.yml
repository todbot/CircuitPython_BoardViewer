name: Update board data

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly on Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Clone CircuitPython (shallow)
      # Full shallow clone, not --filter=tree:0: the generator reads
      # pins.c + mpconfigboard.h for ~1,300 files, which would otherwise
      # trigger a blob fetch per file.
      run: git clone --depth=1 https://github.com/adafruit/circuitpython.git

    - name: Sparse-clone circuitpython-org (_board/ only)
      # blob:none + sparse-checkout so we don't pull hundreds of board
      # photos — only the tiny _board/*.md front-matter files.
      run: |
        git clone --filter=blob:none --no-checkout --depth=1 \
          https://github.com/adafruit/circuitpython-org.git
        cd circuitpython-org
        git sparse-checkout set _board
        git checkout

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Generate board data
      run: python tools/gen_board_data.py --cp circuitpython

    - name: Add board images
      run: python tools/gen_board_images.py --cpyorg circuitpython-org

    - name: Commit if changed
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/board_data.json
        if git diff --staged --quiet; then
          echo "No changes to board_data.json"
        else
          SHA=$(cd circuitpython && git rev-parse --short HEAD)
          git commit -m "Update board data from CircuitPython ${SHA}"
          git push
        fi
